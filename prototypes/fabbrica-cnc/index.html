<script>
'use strict';
// Fabbrica CNC: an isometric factory where CNC machines are bought, built through three
// minigames and run by operators; the order in which a part goes through the
// machines on a line decides which part it makes.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;            // the canvas stays smooth; the workers are drawn as pixel sprites
const FONT = '"Trebuchet MS", Verdana, sans-serif';
const TITLE = 'Fabbrica CNC';
const CONTROLS = [
  'Tocca o clicca: compra, piazza, costruisci e assegna i lavori',
  'Trascina: sposta la visuale  ·  Rotella o pizzico: zoom',
  'Dentro: 1 Operatore · 2 Demolisci · Q squadra · B negozio · R ricette · T attrezzi',
  'Frecce: sposta · + / -: zoom · Spazio: ferma l\'ago · P: pausa · M: audio',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d'); // swapped for the low-resolution world canvas while the world is drawn
const pcan = document.createElement('canvas'), pctx = pcan.getContext('2d');
let VIEW_R = 1;
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  VIEW_R = r;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = 'bold') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textO(s, x, y, size, c, align = 'center', outline = 'rgba(10,14,20,0.85)') { // outlined text
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = outline; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (fill && WOODS.has(fill) && h > 24) { // planks: grain lines, lighter streaks and nails at the corners
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(20,8,2,0.28)'; ctx.lineWidth = 1;
    for (let yy = y + 13; yy < y + h; yy += 13) { ctx.beginPath(); ctx.moveTo(x, yy + 0.5); ctx.lineTo(x + w, yy + 0.5); ctx.stroke(); }
    for (let k = 0; k < w * h / 900; k++) { const hk = (Math.imul(k + 1, 2654435761) ^ (x * 31 + y * 17)) >>> 0; ctx.fillStyle = hk % 2 ? 'rgba(255,214,160,0.08)' : 'rgba(0,0,0,0.1)'; ctx.fillRect(x + hk % Math.max(1, w), y + (hk >> 8) % Math.max(1, h), 10 + hk % 30, 1); }
    ctx.restore();
    if (w > 70 && h > 36) for (const [nx, ny] of [[x + 7, y + 7], [x + w - 10, y + 7], [x + 7, y + h - 10], [x + w - 10, y + h - 10]]) { ctx.fillStyle = '#3a2416'; ctx.fillRect(nx, ny, 4, 4); ctx.fillStyle = '#d8b07a'; ctx.fillRect(nx, ny, 3, 3); }
  }
  if (fill && TEX.has(fill) && h > 20) { ctx.save(); ctx.clip(); TEX.get(fill)(x, y, w, h); ctx.restore(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// each site has its own interface look: wood for the shed, brick for the workshop, riveted steel for the works, glass for the modern plant, dark and gold for the grand one
const HUD_THEMES = [
  { name: 'legno', panel: 'rgba(60,38,24,0.92)', frame: '#4a2f1d', head: '#6b4527', card: '#5c3b25', edge: '#e8b45a', accent: '#f2c230', btn: '#e6e1d3', btnText: '#2b2410', bar: 'rgba(52,32,20,0.95)' },
  { name: 'mattoni', panel: 'rgba(96,42,32,0.93)', frame: '#5a2a20', head: '#8a3e2c', card: '#6e3426', edge: '#f0a878', accent: '#f2c230', btn: '#f0e2d2', btnText: '#3a1a12', bar: 'rgba(84,36,28,0.96)' },
  { name: 'acciaio', panel: 'rgba(46,54,62,0.94)', frame: '#2e363e', head: '#4a5660', card: '#3c464f', edge: '#f2c230', accent: '#f2c230', btn: '#dfe4e8', btnText: '#1e252c', bar: 'rgba(38,45,52,0.97)' },
  { name: 'vetro', panel: 'rgba(28,52,78,0.92)', frame: '#1e3550', head: '#2f5a85', card: '#27466a', edge: '#5bc7ff', accent: '#5bc7ff', btn: '#e8f2fa', btnText: '#14283c', bar: 'rgba(22,42,64,0.96)' },
  { name: 'oro', panel: 'rgba(26,26,38,0.94)', frame: '#1c1c28', head: '#2e2c44', card: '#262536', edge: '#e0b84a', accent: '#e0b84a', btn: '#f2ecd8', btnText: '#22201a', bar: 'rgba(20,20,30,0.97)' },
];
const HT = () => HUD_THEMES[F && typeof F.stage === 'number' ? F.stage : 0] || HUD_THEMES[0];
const texOf = i => [HUD_THEMES[i].panel, HUD_THEMES[i].frame, HUD_THEMES[i].card, HUD_THEMES[i].bar];
const TEX = new Map([ // texture painted inside a themed box, by fill colour
  ...texOf(1).map(f => [f, (x, y, w, h) => { ctx.strokeStyle = 'rgba(30,8,4,0.35)'; ctx.lineWidth = 1; for (let yy = y + 10, k = 0; yy < y + h - 4; yy += 10, k++) { ctx.beginPath(); ctx.moveTo(x, yy + 0.5); ctx.lineTo(x + w, yy + 0.5); ctx.stroke(); if (h >= 40) for (let xx = x + (k % 2) * 14; xx < x + w; xx += 28) { ctx.beginPath(); ctx.moveTo(xx + 0.5, yy - 10); ctx.lineTo(xx + 0.5, yy); ctx.stroke(); } } }]),
  ...texOf(2).map(f => [f, (x, y, w, h) => { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(255,255,255,0.1)'); g.addColorStop(1, 'rgba(0,0,0,0.15)'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); for (let xx = x + 8; xx < x + w - 4; xx += 22) for (const yy of [y + 5, y + h - 8]) { ctx.fillStyle = '#1a2026'; ctx.fillRect(xx, yy, 4, 4); ctx.fillStyle = '#9aa4ad'; ctx.fillRect(xx, yy, 3, 3); } }]),
  ...texOf(3).map(f => [f, (x, y, w, h) => { const g = ctx.createLinearGradient(x, y, x + w * 0.6, y + h); g.addColorStop(0, 'rgba(190,230,255,0.16)'); g.addColorStop(0.5, 'rgba(190,230,255,0.03)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.fillStyle = 'rgba(91,199,255,0.5)'; ctx.fillRect(x, y + 2, w, 1); }]),
  ...texOf(4).map(f => [f, (x, y, w, h) => { ctx.strokeStyle = 'rgba(224,184,74,0.45)'; ctx.lineWidth = 1; ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9); }]),
]);
const WOODS = new Set(['#4a2f1d', '#5c3b25', '#6b4527', '#3a2416', 'rgba(60,38,24,0.92)', 'rgba(58,36,22,0.92)', 'rgba(58,36,22,0.94)', 'rgba(58,36,22,0.88)', 'rgba(58,36,22,0.9)']);
function wrapText(s, x, y, maxW, size, c, lineH, align = 'left') {
  ctx.font = `bold ${size}px ${FONT}`;
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { text(line, x, yy, size, c, align); line = w; yy += lineH; }
    else line = t;
  }
  if (line) text(line, x, yy, size, c, align);
  return yy;
}
function fmt(n) { n = Math.round(n); return n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n); }

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// Pointer: taps and drags go to a queue the fixed step reads; panning and pinching move the camera.
const taps = [];               // logical {x, y} taps for the next step
const ptrs = new Map();        // active pointers
const ptr = { x: W / 2, y: H / 2, down: false, inside: false }; // last pointer, for drags and hover
let pinch = null;
function logical(e) {
  const rc = canvas.getBoundingClientRect();
  return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height };
}
function capturesDrag() { return scene !== 'play' || !!state.mg || !!state.panel || !!state.wallDrag; }
function overButton(x, y) { return ui.buttons.some(b => b.w < W && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); }
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = logical(e);
  ptrs.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false });
  ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.inside = true;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  } else if (scene === 'play' && !state.mg && !state.panel && !overButton(p.x, p.y)) {
    if (!F && state.wtool === 'draw') state.wallDrag = { a: null, b: null };
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* old browsers */ }
});
canvas.addEventListener('pointermove', e => {
  const p = logical(e); ptr.x = p.x; ptr.y = p.y; ptr.inside = true;
  const q = ptrs.get(e.pointerId); if (!q) return;
  const dx = p.x - q.x, dy = p.y - q.y; q.x = p.x; q.y = p.y;
  if (Math.hypot(p.x - q.sx, p.y - q.sy) > 10) q.moved = true;
  if (pinch && ptrs.size >= 2) { // two fingers: zoom and pan together
    const [a, b] = [...ptrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    setZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch.d));
    cam.x -= (mx - pinch.mx) / cam.zoom; cam.y -= (my - pinch.my) / cam.zoom; pinch.mx = mx; pinch.my = my; clampCam();
    q.moved = true; return;
  }

});

  const q = ptrs.get(e.pointerId); if (!q) return;
  ptrs.delete(e.pointerId);
  if (!q.moved && !pinch) {
    // one physical tap can arrive as two events on some browsers: drop the twin
    const last = taps.lastTime || 0, dup = e.timeStamp - last < 60 && Math.hypot(q.x - (taps.lx || -99), q.y - (taps.ly || -99)) < 4;
    if (!dup) { taps.push({ x: q.x, y: q.y }); taps.lastTime = e.timeStamp; taps.lx = q.x; taps.ly = q.y; }
  }
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) ptr.down = false;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; ptr.down = ptrs.size > 0; });
canvas.addEventListener('pointerleave', () => { ptr.inside = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (scene === 'play' && !state.mg && !state.panel) setZoom(cam.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {

      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();

function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }

function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;

const sfx = {
  clack() { tone(140, 0.08, 'square', 0.25); tone(90, 0.12, 'triangle', 0.3, 0.03); },
  bolt() { tone(520, 0.05, 'square', 0.12); },

// ---- Data -------------------------------------------------------------------------------
const ORDER = ['T', 'L', 'F', 'D', 'X'];

  if (pcan.width !== w || pcan.height !== h) { pcan.width = w; pcan.height = h; }
  const keep = ctx; ctx = pctx;
  ctx.setTransform(1 / P, 0, 0, 1 / P, 0, 0); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, W, H);
  drawFn();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(255,186,104,0.08)'; ctx.fillRect(0, 0, w, h); // warm light
  const nk = nightK(), p = dayPhase(), dusk = p > 0.5 && p < 0.75 ? Math.max(0, 1 - Math.abs(p - 0.62) / 0.1) : 0;
  if (dusk > 0) { ctx.fillStyle = `rgba(255,120,50,${0.16 * dusk})`; ctx.fillRect(0, 0, w, h); }
  if (nk > 0) { ctx.fillStyle = `rgba(20,30,80,${tune.nightDark * nk * (F && !(scene === 'play' && state.town) ? 0.6 : 1)})`; ctx.fillRect(0, 0, w, h); }
  const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(30,16,8,${alpha})`); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx = keep; ctx.imageSmoothingEnabled = false; ctx.drawImage(pcan, 0, 0, w * P, h * P); ctx.imageSmoothingEnabled = true;
}
function vignette(alpha) { // darker toward the edges of the screen, the eye goes to the middle
  if (CHEAP) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(8,12,18,${alpha})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function hint(msg) {
  ctx.font = `bold 17px ${FONT}`; const tw = ctx.measureText(msg).width + 30;
  rrect(W / 2 - tw / 2, 124, tw, 34, 10, 'rgba(58,36,22,0.92)', '#f2c230', 1.5); text(msg, W / 2, 142, 17, '#fff');
}
function drawTopLayer(t) {
  if (state.banner) {
    const b = state.banner, a = Math.min(1, b.life * 2, (3.2 - b.life) * 4), y = 222 + (1 - a) * -30;
    ctx.globalAlpha = a; rrect(W / 2 - 330, y, 660, 76, 16, 'rgba(58,36,22,0.94)', b.col, 3);
    text(b.title, W / 2, y + 26, 26, b.col); text(b.sub, W / 2, y + 56, 16, '#e6e1d3'); ctx.globalAlpha = 1;
  }
  state.toasts.forEach((tt, i) => {
    const y = 540 - i * 44; ctx.globalAlpha = Math.min(1, tt.life * 2);
    ctx.font = `bold 17px ${FONT}`; const tw = ctx.measureText(tt.msg).width + 30;
    rrect(W / 2 + 20 - tw / 2, y, tw, 36, 10, 'rgba(58,36,22,0.92)', tt.col, 1.5); text(tt.msg, W / 2 + 20, y + 19, 17, tt.col); ctx.globalAlpha = 1;
  });
  if (state.placing) {
    const P = state.placing, name = P.kind === 'mach' ? MACH[P.m ? P.m.type : P.type].name : LOGI[P.kind].name;
    hint(`${P.m ? 'Sposta' : 'Piazza'}: ${name}  ·  tocca una cella libera del capannone`);
    button('Annulla', W / 2 - 80, 168, 160, 46, () => { state.placing = null; }, { color: '#9aa4ad', size: 18, name: 'cancel' });
  } else if (state.tool === 'op') hint(`Operatore: tocca una macchina per metterci o toglierci un Operatore macchina (${opsFree()} liberi)`);
  else if (state.tool === 'demo') hint('Demolisci: tocca due volte una macchina, un magazzino o una cassa per venderli');
  else if (!F && state.wtool === 'draw') hint(`Capannone: trascina un rettangolo sul prato per disegnarne le pareti (${tune.cellCost} monete a cella)`);
  if (!F && state.wplacing) {
    hint('Capannone: tocca dentro le mura, su terreno libero (verde = va bene)');
    button('Annulla', W / 2 - 80, 168, 160, 46, () => { state.wplacing = null; }, { color: '#9aa4ad', size: 18, name: 'cancelB' });
  }
}

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#2b3a48');
      ORDER.forEach((tp, i) => {
        const x = 150 + i * 245, y = 330;
        ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x - 110, 90, 220, 300);
        machineIcon(tp, x, y, 2.6, { t: 1.3, busy: true, status: 'work' });
        text(MACH[tp].name, x, 420, 17, '#fff');
      });
      const at = (x, y, s, c, r, f) => { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const p = iso(c, r); ctx.translate(-p[0], -p[1]); f(); ctx.restore(); };
      const items = [
        ['Operaio', (x, y) => sprite('walk0', x, y, 5, false)],
        ['Operaio che saluta', (x, y) => sprite('wave', x, y, 5, false)],
        ['Operaio al lavoro', (x, y) => sprite('work', x, y, 5, false)],
        ['Rack di rete', (x, y) => at(x, y + 30, 1.5, 0.5, 0.5, () => drawRack(0, 0, 1))],
        ['Banco barre', (x, y) => at(x, y + 10, 1.8, 0.5, 0.5, () => drawSource(0, 0))],
        ['Cassa vendita', (x, y) => at(x, y + 10, 1.8, 0.5, 0.5, () => drawCrateAt(0, 0, 0))],
        ['Operatore', (x, y) => sprite('work', x, y, 5, false, OP_PAL)],
        ['Magazziniere', (x, y) => sprite('walk0', x, y, 5, false, MAG_PAL)],
        ['Informatico', (x, y) => sprite('walk0', x, y, 5, false, IT_PAL)],
        ['Postazione PC', (x, y) => at(x, y + 10, 1.8, 0.5, 0.5, () => drawPC(0, 0, 1))],
        ['Pezzi', (x, y) => at(x, y, 1.6, 1.5, 0.5, () => ['', 'T', 'TL', 'TF', 'TFD', 'TX'].forEach((o, k) => drawPiece(o, 0.35 + k * 0.48, 0.5)))],
      ];
      items.push(['Capannone', (x, y) => at(x, y + 10, 0.55, 1.5, 1.5, () => drawBuildingOut({ machines: [] }, 0, rectCells(0, 0, 3, 3)))]);
      items.forEach(([name, f], i) => { const x = 60 + (i % 9) * 145, y = i < 9 ? 560 : 690; f(x, y); text(name, x, y + 26, 13, '#fff'); });
    },
  },
  move: {
    update(dt) {
      const M = state.move; M.t += dt; state.t += dt * 0.3;
      if (M.t > tune.moveLength && (taps.splice(0).length || pressed('Enter') || pressed('Space'))) { scene = 'play'; centerCam(); showBanner(`Capitolo ${M.st + 1}: ${TIERS[M.st].name}`, `Nuova sede vuota da ${shedSize(M.st).join('×')} celle · le altre continuano a produrre`, '#5bc7ff'); }
      else if (M.t < tune.moveLength && (pressed('Enter') || pressed('Escape'))) M.t = tune.moveLength;
      taps.length = 0;
    },
    draw() {
      ui = { buttons: [], named: {} };
      const M = state.move, u = Math.min(1, M.t / tune.moveLength);
      moveCam(u, M.from, M.to);
      pixelPass(() => { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y); drawTown(state.t); ctx.restore(); }, 0.25);
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, 56); ctx.fillRect(0, H - 56, W, 56);
      const T = TIERS[M.st], a = Math.min(1, M.t * 1.5);
      ctx.globalAlpha = a;
      rrect(W / 2 - 420, 76, 840, 132, 16, 'rgba(58,36,22,0.94)', '#e8b45a', 3);
      text(`Capitolo ${M.st + 1}`, W / 2, 100, 18, '#e8b45a'); text(T.name, W / 2, 130, 30, '#fff');
      wrapText(T.text, W / 2, 162, 780, 16, '#e8dcc0', 20, 'center');
      ctx.globalAlpha = 1;
      text(u >= 1 ? 'Tocca per entrare nella nuova sede' : 'Invio per saltare', W / 2, H - 28, 17, u >= 1 ? '#ffe08a' : '#9a8a78');
    },
  },
  intro: {
    update(dt) {
      state.introT = (state.introT || 0) + dt; state.t += dt * 0.3;
      if (taps.splice(0).length || pressed('Enter') || pressed('Space') || pressed('Escape') || state.introT >= tune.introLength) endIntro();
    },
    draw() {
      ui = { buttons: [], named: {} };
      const u = Math.min(1, (state.introT || 0) / tune.introLength), cap = introCam(u);
      pixelPass(() => { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y); drawTown(state.introT || 0); ctx.restore(); }, 0.25);
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, 56); ctx.fillRect(0, H - 56, W, 56); // letterbox
      if (cap) { const a = Math.min(1, u * 8); ctx.globalAlpha = a; textO(cap, W / 2, H - 92, 26, '#ffe8b0'); ctx.globalAlpha = 1; }
      text('Tocca o premi Invio per saltare', W - 24, H - 28, 15, '#9a8a78', 'right');
      if (u > 0.88) { ctx.fillStyle = `rgba(20,12,6,${Math.min(1, (u - 0.88) / 0.12)})`; ctx.fillRect(0, 0, W, H); } // into the dark doorway
      if (u < 0.06) { ctx.fillStyle = `rgba(0,0,0,${1 - u / 0.06})`; ctx.fillRect(0, 0, W, H); }
    },
  },
  title: {
    update() {
      const tp = taps.splice(0);
      for (const p of tp) hitButtons(p.x, p.y);
      if (pressed('Enter') || pressed('Space')) startGame(true);
      if (pressed('KeyN')) startGame(false);
    },
    draw() {
      ui = { buttons: [], named: {} };
      introCam(0.35 + 0.05 * Math.sin(clock.now() * 0.1)); pixelPass(() => { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y); drawTown(clock.now()); ctx.restore(); }, 0.25);
      ctx.fillStyle = 'rgba(14,20,28,0.62)'; ctx.fillRect(0, 0, W, H);
      rrect(W / 2 - 360, 70, 720, 130, 22, 'rgba(28,36,44,0.92)', '#f2c230', 4);
      for (let i = 0; i < 680; i += 34) { ctx.fillStyle = (i / 34) % 2 ? '#2b2b2b' : '#f2c230'; ctx.fillRect(W / 2 - 340 + i, 178, 34, 8); }
      textO(TITLE, W / 2, 124, 72, '#f2c230', 'center', '#2b2b2b');
      text('Compra, monta, cabla e configura le tue macchine CNC', W / 2, 232, 22, '#e6e1d3');
      rrect(W / 2 - 440, 266, 880, 148, 14, 'rgba(20,26,34,0.9)', '#3a4552', 2);
      CONTROLS.forEach((c, i) => text(c, W / 2, 290 + i * 34, 18, '#cfd6dd'));
      ORDER.forEach((tp, i) => machineIcon(tp, W / 2 - 400 + i * 200, 520, 1.3, { t: clock.now(), busy: true, status: 'work' }));
      const sv = hasSave();
      button(sv ? 'Continua' : 'Gioca', W / 2 - 150, 560, 300, 70, () => startGame(true), { size: 28, name: 'play' });
      if (sv) button(confirmNew ? 'Sicuro? Tocca ancora' : 'Nuova partita (N)', W / 2 - 150, 642, 300, 50, () => startGame(false), { size: 18, color: '#9aa4ad', name: 'new' });
      text(sv ? 'Invio: continua' : 'Invio o tocca per iniziare', W / 2, 708, 15, '#9aa4ad');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.panel && !state.mg && !state.placing && !state.tool && !state.wtool && !state.wplacing)) { scene = 'pause'; confirmNew = 0; return; }
      if (pressed('Escape')) { if (state.mg && state.mg.step === 'intro') state.mg = null; state.panel = null; state.placing = null; state.tool = null; state.demo = null; state.wtool = null; state.wplacing = null; }
      if (!state.mg) {
        if (pressed('KeyB')) { openPanel(F ? 'shop' : 'wshop'); state.shopTab = 0; }
        if (pressed('KeyR')) openPanel('recipes');
        if (pressed('KeyT')) openPanel('tools');
        if (pressed('KeyQ')) openPanel('crew');
        if (pressed('KeyU') && F) openPanel('office');
        if (!state.panel) {
          if (F) {
            if (pressed('Digit1')) setTool(state.tool === 'op' ? null : 'op');
            if (pressed('Digit2')) setTool(state.tool === 'demo' ? null : 'demo');
          } else if (pressed('Digit1')) { if (state.wtool === 'draw') state.wtool = null; else setWTool('draw'); }
          const sp = tune.panSpeed * dt / cam.zoom;
          if (down.has('ArrowLeft')) cam.x -= sp; if (down.has('ArrowRight')) cam.x += sp;
          if (down.has('ArrowUp')) cam.y -= sp; if (down.has('ArrowDown')) cam.y += sp;
          if (pressed('Equal') || pressed('NumpadAdd')) setZoom(cam.zoom * 1.2);
          if (pressed('Minus') || pressed('NumpadSubtract')) setZoom(cam.zoom / 1.2);
          clampCam();
        }
      } else updateMinigame(dt);
      if (state.wallDrag) {
        if (!F && !state.panel && state.wtool === 'draw') { if (ptr.down) wallDragStep(); }
        if (!ptr.down) { const d = state.wallDrag; state.wallDrag = null; if (d.a && d.b && (d.a[0] !== d.b[0] || d.a[1] !== d.b[1])) commitDraw(rectOf(d.a, d.b)); }
      }
      const tp = taps.splice(0);
      if (pressed('KeyE') && !state.mg && !state.panel) toggleTown();
      if (pressed('KeyF') && !state.mg) toggleTime();
      for (const p of tp) { if (!hitButtons(p.x, p.y) && !state.mg && !state.panel) { if (state.town) townTap(p.x, p.y); else if (F) worldTap(p.x, p.y); else outsideTap(p.x, p.y); } }
      updateWorld(dt);
    },
    draw() {
      const t = state.t;
      ui = { buttons: [], named: {} };
      if (state.town) { pixelPass(() => { ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y); drawTown(t); ctx.restore(); }, 0.22); drawTownLabels(t); }
      else { pixelPass(() => { if (F) drawWorld(t); else drawOutside(t); }, F ? 0.34 : 0.22); if (F) drawOverlaysWorld(t); else drawOverlaysOut(t); }
      drawHUD(t);
      drawTopLayer(t);
      if (state.panel === 'shop') drawShop(t);
      else if (state.panel === 'recipes') drawRecipes(t);
      else if (state.panel === 'tools') drawTools(t);
      else if (state.panel === 'office') drawOfficePanel(t);
      else if (state.panel === 'machine') drawMachinePanel(t);
      else if (state.panel === 'wshop') drawWorldShop(t);
      else if (state.panel === 'crew') drawCrew(t);
      else if (state.panel === 'routes') drawRoutes(t);
      if (state.mg) drawMinigame(t);
      if (!state.town) drawTutorial(t);
    },
  },
  pause: {
    update() {
      const tp = taps.splice(0); for (const p of tp) hitButtons(p.x, p.y);
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyN')) newGameFromPause();
    },
    draw() {
      scenes.play.draw(); ui = { buttons: [], named: {} };
      ctx.fillStyle = 'rgba(10,14,20,0.7)'; ctx.fillRect(0, 0, W, H);
      textO('Pausa', W / 2, 220, 64, '#f2c230');
      text('La fabbrica è salvata automaticamente.', W / 2, 290, 20, '#e6e1d3');
      button('Riprendi (P)', W / 2 - 150, 340, 300, 66, () => { scene = 'play'; }, { size: 24, name: 'resume' });
      button(confirmNew ? 'Sicuro? Tocca ancora' : 'Ricomincia da zero (N)', W / 2 - 150, 430, 300, 54, newGameFromPause, { size: 18, color: '#ff8a7a', name: 'restart' });
      text(muted ? 'Audio: spento (M)' : 'Audio: acceso (M)', W / 2, 520, 18, '#cfd6dd');
    },
  },
};
function newGameFromPause() {
  if (!confirmNew) { confirmNew = 1; return; }
  confirmNew = 0; wipeSave(); reset(); scene = 'play'; toast('Nuova fabbrica!', '#7ef0a0');
}
function startGame(cont) {
  if (cont && hasSave()) { if (!load()) { reset(); state.introT = 0; scene = 'intro'; startAudio(); return; } scene = 'play'; startAudio(); return; }
  if (!cont && hasSave()) { if (!confirmNew) { confirmNew = 1; return; } confirmNew = 0; wipeSave(); }
  reset(); state.introT = 0; scene = 'intro'; startAudio();
}
function hitButtons(x, y) {
  for (let i = ui.buttons.length - 1; i >= 0; i--) {
    const b = ui.buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; }
  }
  return false;
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (taps.length) drawFrame(); // buttons are laid out by drawing: make sure they match this state
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx.setTransform(VIEW_R, 0, 0, VIEW_R, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  tap(x, y) { taps.push({ x, y }); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
