// minigames (assembly, network, configuration) and lined up on belts; the order of the

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size

const CONTROLS = [
  'Tocca o clicca: compra, piazza e costruisci',
  'Trascina: sposta la visuale  ·  Rotella o pizzico: zoom',
  'Frecce: sposta  ·  + / -: zoom  ·  B negozio  ·  R ricette  ·  T attrezzi',
  'Spazio: ferma l\'ago  ·  P: pausa  ·  M: audio',
];

const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_R = 1;
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  VIEW_R = r;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = 'bold') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textO(s, x, y, size, c, align = 'center', outline = 'rgba(10,14,20,0.85)') { // outlined text
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = outline; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);

function fmt(n) { n = Math.round(n); return n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n); }

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {

addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// Pointer: taps and drags go to a queue the fixed step reads; panning and pinching move the camera.
const taps = [];               // logical {x, y} taps for the next step
const ptrs = new Map();        // active pointers
const ptr = { x: W / 2, y: H / 2, down: false, inside: false }; // last pointer, for drags and hover
let pinch = null;
function logical(e) {
  const rc = canvas.getBoundingClientRect();
  return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height };
}
function capturesDrag() { return scene !== 'play' || !!state.mg || !!state.panel; }
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = logical(e);
  ptrs.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false });
  ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.inside = true;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];

canvas.addEventListener('pointermove', e => {
  const p = logical(e); ptr.x = p.x; ptr.y = p.y; ptr.inside = true;
  const q = ptrs.get(e.pointerId); if (!q) return;
  const dx = p.x - q.x, dy = p.y - q.y; q.x = p.x; q.y = p.y;

// ---- Audio: started on first input, mute on M --------------------------------------------

const PHASES = ['Montaggio', 'Rete', 'Configurazione'];

  { key: 'W', name: 'Chiave dinamometrica', phase: 0, req: 'toolReqW', eff: l => `${boltTurnsAt(l)} giri per bullone` },

  { id: 'line2', name: 'Linea 2', desc: 'Il capannone si allarga: nuova linea e nuovo operaio', cost: () => tune.line2Cost, lvl: () => tune.line2Lvl, done: () => state.linesOpen >= 2, can: () => true, apply() { state.linesOpen = 2; } },
  { id: 'long', name: 'Linee lunghe', desc: 'Ogni linea passa da 4 a 5 posti macchina', cost: () => tune.longCost, lvl: () => tune.longLvl, done: () => state.slotsPerLine >= 5, can: () => true, apply() { state.slotsPerLine = 5; } },

];

// ---- State ------------------------------------------------------------------------------
let scene, state;
const cam = { x: 0, y: 0, zoom: 1.75 };
let ui = { buttons: [], named: {} };
let confirmNew = 0;
const SAVE_KEY = 'fabbricaCNC_v1';

function newLines() { return [0, 1, 2].map(() => ({ slots: [null, null, null, null, null], pieces: [], spawnT: 0 })); }

    t: 0, score: 0, gained: '',
    coins: tune.startCoins, xp: 0, level: 1, sold: 0, earned: 0,
    tools: { W: 1, C: 1, Te: 1 }, linesOpen: 1, slotsPerLine: 4,
    lines: newLines(), found: [], goal: 0, nextId: 1,

function allMachines() { const a = []; state.lines.forEach(L => L.slots.forEach(m => { if (m) a.push(m); })); return a; }

function serialize() {

    v: 1, coins: state.coins, xp: state.xp, level: state.level, sold: state.sold, earned: state.earned,
    tools: state.tools, linesOpen: state.linesOpen, slotsPerLine: state.slotsPerLine, found: state.found,
    goal: state.goal, nextId: state.nextId, workers: state.workers.length,

    if (m) state.lines[li].slots[si] = makeMachine(m.type, li, si, m.id, m.phase, m.pct);

  state.workers = [];

const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;

// ---- Camera -----------------------------------------------------------------------------
const TW = 64, TH = 32;

function toCell(sx, sy) {

// ---- Drawing primitives (world space) ---------------------------------------------------
function poly(pts, fill, stroke, lw = 1) {

function box(c0, r0, c1, r1, z0, z1, col, stroke = EDGE) {

  poly([iso(c1, r0, z0), iso(c1, r1, z0), iso(c1, r1, z1), iso(c1, r0, z1)], shade(col, 0.64), stroke);

}
const qL = (c0, c1, r, za, zb) => [iso(c0, r, za), iso(c1, r, za), iso(c1, r, zb), iso(c0, r, zb)]; // on a front-left face
const qR = (c, r0, r1, za, zb) => [iso(c, r0, za), iso(c, r1, za), iso(c, r1, zb), iso(c, r0, zb)]; // on a front-right face

function afterResult() {
  const mg = state.mg, m = mg.m;
  if (!mg.recal && m.phase < 3) { state.mg = { m, phase: m.phase, step: 'intro', recal: false }; return; }
  state.mg = null;
  if (!mg.recal) {
    showBanner(`${MACH[m.type].name} in rete!`, `Qualità ${Math.round(m.quality * 100)}%  ·  rende x${(tune.qualityBase + m.quality).toFixed(2)}`, '#5be38f');
    clearLine(state.lines[m.line]);
  } else toast(mg.better ? 'Configurazione migliorata!' : 'Tenuta la configurazione migliore', '#bfe3ff');
}
function updateMinigame(dt) {
  const mg = state.mg;
  mg.flash = Math.max(0, (mg.flash || 0) - dt);
  if (mg.step === 'intro' && (pressed('Enter') || pressed('Space'))) { beginPhase(); return; }
  if (mg.step === 'result' && (pressed('Enter') || pressed('Space'))) { afterResult(); return; }
  if (mg.step !== 'play') return;
  mg.elapsed += dt;
  if (mg.phase === 0) {
    for (const b of mg.bolts) b.spin = Math.max(0, (b.spin || 0) - dt * 4);
  } else if (mg.phase === 1) {
    const head = mg.path[mg.path.length - 1];
    if (pressed('ArrowRight')) netExtend(head[0] + 1, head[1]);
    else if (pressed('ArrowLeft')) netExtend(head[0] - 1, head[1]);
    else if (pressed('ArrowUp')) netExtend(head[0], head[1] - 1);
    else if (pressed('ArrowDown')) netExtend(head[0], head[1] + 1);
    if (ptr.down && !mg.linked) {
      const [ox, oy] = netOrigin(), c = Math.floor((ptr.x - ox) / NETCELL), r = Math.floor((ptr.y - oy) / NETCELL);
      if (c >= 0 && r >= 0 && c < mg.gc && r < mg.gr) netDragTo(c, r);
    }
    if (mg.linked && pressed('Space')) crimp();
  } else {
    const d = mg.dials[mg.cur];
    mg.ph += mg.speed * dt; d.at = 0.5 - 0.5 * Math.cos(mg.ph);
    if (pressed('Space')) stopNeedle();
  }
}
function tapBolt(i) {
  const mg = state.mg, b = mg.bolts[i];
  if (b.turns >= mg.need) return;
  if (i !== mg.next) { mg.pen += tune.mgPenalty; mg.flash = 0.3; mg.wrong = i; sfx.wrong(); return; }
  b.turns++; b.spin = 1; b.ang += Math.PI / 3;
  if (b.turns >= mg.need) { mg.next++; sfx.boltDone(); if (mg.next >= mg.bolts.length) finishPhase(); }
  else sfx.bolt();
}
function crimp() {
  const mg = state.mg; if (!mg.linked) return;
  mg.crimpLeft--; sfx.crimp(); mg.crimpAnim = 1;
  if (mg.crimpLeft <= 0) finishPhase();
}
function stopNeedle() {
  const mg = state.mg, d = mg.dials[mg.cur];
  if (d.at >= d.z0 && d.at <= d.z0 + d.z) {
    d.locked = true; sfx.lock(); mg.cur++;
    if (mg.cur >= mg.dials.length) finishPhase(); else mg.ph = rng() * 6;
  } else { mg.pen += tune.mgPenalty; mg.flash = 0.3; sfx.wrong(); }
}

  for (const m of allMachines()) if (m.phase < 3) {
    const p = iso(m.slot + 1.5, lineRow(m.line) + 0.5, machineTop(m.type) + 18), [sx, sy0] = toScreen(p[0], p[1]), sy = sy0 + Math.sin(t * 3 + m.id) * 4;
    rrect(sx - 22, sy - 22, 44, 40, 10, '#fff', '#2b2b2b', 2);
    poly([[sx - 6, sy + 17], [sx + 6, sy + 17], [sx, sy + 26]], '#fff'); phaseIcon(m.phase, sx, sy - 2, 1.2);
  }
  // floating coins
  for (const f of state.floats) {
    const [sx, sy] = toScreen(f.wx, f.wy), a = Math.min(1, f.life * 2);
    ctx.globalAlpha = a; if (f.coin) coinIcon(sx - 24, sy, 0.8); textO(f.txt, sx + (f.coin ? 4 : 0), sy, 20, f.col); ctx.globalAlpha = 1;
  }
  // welcome bubble over the first worker
  if (state.welcome > 0 && state.workers[0] && !state.placing && !state.panel) {
    const w = state.workers[0], p = iso(w.c, w.r, 44), [sx, sy] = toScreen(p[0], p[1]);
    rrect(sx - 120, sy - 46, 240, 40, 10, '#fff', '#2b2b2b', 2); poly([[sx - 8, sy - 7], [sx + 8, sy - 7], [sx, sy + 4]], '#fff');
    text('Benvenuto in fabbrica, capo!', sx, sy - 26, 17, '#2b2b2b');
  }
}
function drawTopLayer(t) {
  if (state.banner) {
    const b = state.banner, a = Math.min(1, b.life * 2, (3.2 - b.life) * 4), y = 108 + (1 - a) * -30;
    ctx.globalAlpha = a; rrect(W / 2 - 330, y, 660, 76, 16, 'rgba(20,26,34,0.92)', b.col, 3);
    text(b.title, W / 2, y + 26, 26, b.col); text(b.sub, W / 2, y + 56, 16, '#e6e1d3'); ctx.globalAlpha = 1;
  }
  state.toasts.forEach((tt, i) => {
    const y = 560 - i * 44; ctx.globalAlpha = Math.min(1, tt.life * 2);
    ctx.font = `bold 17px ${FONT}`; const tw = ctx.measureText(tt.msg).width + 30;
    rrect(W / 2 - tw / 2 - 120, y, tw, 36, 10, 'rgba(20,26,34,0.9)', tt.col, 1.5); text(tt.msg, W / 2 - 120, y + 19, 17, tt.col); ctx.globalAlpha = 1;
  });
  if (state.placing) {
    text(state.placing.m ? 'Scegli dove spostarla' : `Piazza: ${MACH[state.placing.type].name}`, W / 2 - 120, 108, 20, '#fff');
    button('Annulla', W / 2 - 200, 126, 160, 46, () => { state.placing = null; }, { color: '#9aa4ad', size: 18, name: 'cancel' });
  }
}

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#2b3a48');
      const t = state.t;
      ORDER.forEach((tp, i) => {
        const x = 150 + i * 245, y = 330;
        ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x - 110, 90, 220, 300);
        machineIcon(tp, x, y, 2.6, { t: 1.3, busy: true, status: 'work' });
        text(MACH[tp].name, x, 420, 17, '#fff');
      });
      const items = [
        ['Operaio', (x, y) => sprite('walk0', x, y, 5, false)],
        ['Operaio che saluta', (x, y) => sprite('wave', x, y, 5, false)],
        ['Operaio al lavoro', (x, y) => sprite('work', x, y, 5, false)],
        ['Rack di rete', (x, y) => { ctx.save(); ctx.translate(x, y + 30); ctx.scale(1.5, 1.5); ctx.translate(-iso(7.5, 0.5)[0], -iso(7.5, 0.5)[1]); drawRack(1); ctx.restore(); }],
        ['Magazzino barre', (x, y) => { ctx.save(); ctx.translate(x, y + 10); ctx.scale(1.8, 1.8); ctx.translate(-iso(0.5, 1.5)[0], -iso(0.5, 1.5)[1]); drawFeeder(0); ctx.restore(); }],
        ['Cassa pezzi', (x, y) => { ctx.save(); ctx.translate(x, y + 10); ctx.scale(1.8, 1.8); ctx.translate(-iso(6.5, 1.5)[0], -iso(6.5, 1.5)[1]); drawCrate(0, 0, 0); ctx.restore(); }],
        ['Pezzi', (x, y) => { ctx.save(); ctx.translate(x, y); ctx.scale(2.2, 2.2); ['', 'T', 'TL', 'TF', 'TFD', 'TX'].forEach((o, k) => { const p = iso(0, 0); ctx.save(); ctx.translate(-30 + k * 13 - p[0], (k % 2) * 10 - 10 - p[1]); drawPiece(o, 0, 0); ctx.restore(); }); ctx.restore(); }],
      ];
      items.forEach(([name, f], i) => { const x = 100 + i * 180, y = 600; f(x, y); text(name, x, 660, 15, '#fff'); });
    },
  },
  title: {
    update() {
      const tp = taps.splice(0);
      for (const p of tp) hitButtons(p.x, p.y);
      if (pressed('Enter') || pressed('Space')) startGame(true);
      if (pressed('KeyN')) startGame(false);
    },
    draw() {
      ui = { buttons: [], named: {} };
      drawWorld(clock.now());
      ctx.fillStyle = 'rgba(14,20,28,0.62)'; ctx.fillRect(0, 0, W, H);
      rrect(W / 2 - 360, 70, 720, 130, 22, 'rgba(28,36,44,0.92)', '#f2c230', 4);
      for (let i = 0; i < 680; i += 34) { ctx.fillStyle = (i / 34) % 2 ? '#2b2b2b' : '#f2c230'; ctx.fillRect(W / 2 - 340 + i, 178, 34, 8); }
      textO(TITLE, W / 2, 124, 72, '#f2c230', 'center', '#2b2b2b');
      text('Compra, monta, cabla e configura le tue macchine CNC', W / 2, 232, 22, '#e6e1d3');
      rrect(W / 2 - 440, 266, 880, 148, 14, 'rgba(20,26,34,0.9)', '#3a4552', 2);
      CONTROLS.forEach((c, i) => text(c, W / 2, 290 + i * 34, 18, '#cfd6dd'));
      ORDER.forEach((tp, i) => machineIcon(tp, W / 2 - 400 + i * 200, 520, 1.3, { t: clock.now(), busy: true, status: 'work' }));
      const sv = hasSave();
      button(sv ? 'Continua' : 'Gioca', W / 2 - 150, 560, 300, 70, () => startGame(true), { size: 28, name: 'play' });
      if (sv) button(confirmNew ? 'Sicuro? Tocca ancora' : 'Nuova partita (N)', W / 2 - 150, 642, 300, 50, () => startGame(false), { size: 18, color: '#9aa4ad', name: 'new' });
      text(sv ? 'Invio: continua' : 'Invio o tocca per iniziare', W / 2, 708, 15, '#9aa4ad');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.panel && !state.mg && !state.placing)) { scene = 'pause'; confirmNew = 0; return; }
      if (pressed('Escape')) { if (state.mg && state.mg.step === 'intro') state.mg = null; state.panel = null; state.placing = null; }
      if (!state.mg) {
        if (pressed('KeyB')) openPanel('shop');
        if (pressed('KeyR')) openPanel('recipes');
        if (pressed('KeyT')) openPanel('tools');
        if (!state.panel) {
          const sp = tune.panSpeed * dt / cam.zoom;
          if (down.has('ArrowLeft')) cam.x -= sp; if (down.has('ArrowRight')) cam.x += sp;
          if (down.has('ArrowUp')) cam.y -= sp; if (down.has('ArrowDown')) cam.y += sp;
          if (pressed('Equal') || pressed('NumpadAdd')) setZoom(cam.zoom * 1.2);
          if (pressed('Minus') || pressed('NumpadSubtract')) setZoom(cam.zoom / 1.2);
          clampCam();
        }
      } else updateMinigame(dt);
      const tp = taps.splice(0);
      for (const p of tp) { if (!hitButtons(p.x, p.y) && !state.mg && !state.panel) worldTap(p.x, p.y); }
      updateWorld(dt);
    },
    draw() {
      const t = state.t;
      ui = { buttons: [], named: {} };
      drawWorld(t);
      drawOverlaysWorld(t);
      drawHUD(t);
      drawTopLayer(t);
      if (state.panel === 'shop') drawShop(t);
      else if (state.panel === 'recipes') drawRecipes(t);
      else if (state.panel === 'tools') drawTools(t);
      else if (state.panel === 'machine') drawMachinePanel(t);
      if (state.mg) drawMinigame(t);
      drawTutorial(t);
    },
  },
  pause: {
    update() {
      const tp = taps.splice(0); for (const p of tp) hitButtons(p.x, p.y);
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyN')) newGameFromPause();
    },
    draw() {
      scenes.play.draw(); ui = { buttons: [], named: {} };
      ctx.fillStyle = 'rgba(10,14,20,0.7)'; ctx.fillRect(0, 0, W, H);
      textO('Pausa', W / 2, 220, 64, '#f2c230');
      text('La fabbrica è salvata automaticamente.', W / 2, 290, 20, '#e6e1d3');
      button('Riprendi (P)', W / 2 - 150, 340, 300, 66, () => { scene = 'play'; }, { size: 24, name: 'resume' });
      button(confirmNew ? 'Sicuro? Tocca ancora' : 'Ricomincia da zero (N)', W / 2 - 150, 430, 300, 54, newGameFromPause, { size: 18, color: '#ff8a7a', name: 'restart' });
      text(muted ? 'Audio: spento (M)' : 'Audio: acceso (M)', W / 2, 520, 18, '#cfd6dd');
    },
  },
};
function newGameFromPause() {
  if (!confirmNew) { confirmNew = 1; return; }
  confirmNew = 0; wipeSave(); reset(); scene = 'play'; toast('Nuova fabbrica!', '#7ef0a0');
}
function startGame(cont) {
  if (cont && hasSave()) { if (!load()) reset(); }
  else if (!cont && hasSave()) { if (!confirmNew) { confirmNew = 1; return; } confirmNew = 0; wipeSave(); reset(); }
  else reset();
  scene = 'play'; startAudio();
}
function hitButtons(x, y) {
  for (let i = ui.buttons.length - 1; i >= 0; i--) {
    const b = ui.buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; }
  }
  return false;
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (taps.length) drawFrame(); // buttons are laid out by drawing: make sure they match this state
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx.setTransform(VIEW_R, 0, 0, VIEW_R, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  tap(x, y) { taps.push({ x, y }); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
