<script>
'use strict';
// Fabbrica CNC: an isometric factory where CNC machines are bought, built through three
// minigames (assembly, network, configuration) and lined up on belts; the order of the
// machines on a line decides which part it makes.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;            // the canvas stays smooth; the workers are drawn as pixel sprites
const FONT = '"Trebuchet MS", Verdana, sans-serif';
const TITLE = 'Fabbrica CNC';
const CONTROLS = [
  'Fuori: disegna i tuoi capannoni trascinando sul prato · toccane uno per entrarci (X per uscire)',
  'Trascina: sposta la visuale  ·  Rotella o pizzico: zoom',
  '1 Nastro · 2 Ruota · 3 Demolisci · E gira il pezzo · B negozio · R ricette · T attrezzi',
  'Frecce: sposta · + / -: zoom · Spazio: ferma l\'ago · P: pausa · M: audio',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_R = 1;
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  VIEW_R = r;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = 'bold') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textO(s, x, y, size, c, align = 'center', outline = 'rgba(10,14,20,0.85)') { // outlined text
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = outline; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();

}
function wrapText(s, x, y, maxW, size, c, lineH, align = 'left') {
  ctx.font = `bold ${size}px ${FONT}`;
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { text(line, x, yy, size, c, align); line = w; yy += lineH; }
    else line = t;
  }
  if (line) text(line, x, yy, size, c, align);
  return yy;
}
function fmt(n) { n = Math.round(n); return n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n); }

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();

addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// Pointer: taps and drags go to a queue the fixed step reads; panning and pinching move the camera.
const taps = [];               // logical {x, y} taps for the next step
const ptrs = new Map();        // active pointers
const ptr = { x: W / 2, y: H / 2, down: false, inside: false }; // last pointer, for drags and hover
let pinch = null;
function logical(e) {
  const rc = canvas.getBoundingClientRect();
  return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height };
}
function capturesDrag() { return scene !== 'play' || !!state.mg || !!state.panel || !!state.beltDrag || !!state.wallDrag; }
function overButton(x, y) { return ui.buttons.some(b => b.w < W && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h); }
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const p = logical(e);
  ptrs.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false });
  ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.inside = true;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    if (state) state.beltDrag = null;
  } else if (scene === 'play' && !state.mg && !state.panel && !overButton(p.x, p.y)) {
    if (F && state.tool === 'belt') state.beltDrag = { last: null };
    else if (!F && state.wtool === 'draw') state.wallDrag = { a: null, b: null };
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* old browsers */ }
});
canvas.addEventListener('pointermove', e => {
  const p = logical(e); ptr.x = p.x; ptr.y = p.y; ptr.inside = true;
  const q = ptrs.get(e.pointerId); if (!q) return;
  const dx = p.x - q.x, dy = p.y - q.y; q.x = p.x; q.y = p.y;
  if (Math.hypot(p.x - q.sx, p.y - q.sy) > 10) q.moved = true;
  if (pinch && ptrs.size >= 2) { // two fingers: zoom and pan together
    const [a, b] = [...ptrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    setZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, pinch.d));
    cam.x -= (mx - pinch.mx) / cam.zoom; cam.y -= (my - pinch.my) / cam.zoom; pinch.mx = mx; pinch.my = my; clampCam();
    q.moved = true; return;
  }
  if (q.moved && !capturesDrag()) { cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom; clampCam(); }
});
function endPtr(e) {
  const q = ptrs.get(e.pointerId); if (!q) return;
  ptrs.delete(e.pointerId);
  if (!q.moved && !pinch) {
    // one physical tap can arrive as two events on some browsers: drop the twin
    const last = taps.lastTime || 0, dup = e.timeStamp - last < 60 && Math.hypot(q.x - (taps.lx || -99), q.y - (taps.ly || -99)) < 4;
    if (!dup) { taps.push({ x: q.x, y: q.y }); taps.lastTime = e.timeStamp; taps.lx = q.x; taps.ly = q.y; }
  }

  if (ptrs.size === 0) ptr.down = false;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; ptr.down = ptrs.size > 0; });
canvas.addEventListener('pointerleave', () => { ptr.inside = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (scene === 'play' && !state.mg && !state.panel) setZoom(cam.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    try {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    } catch (_) { return; }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();

  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);

const sfx = {
  clack() { tone(140, 0.08, 'square', 0.25); tone(90, 0.12, 'triangle', 0.3, 0.03); },
  bolt() { tone(520, 0.05, 'square', 0.12); },
  boltDone() { tone(660, 0.06, 'square', 0.15); tone(880, 0.08, 'square', 0.12, 0.05); },
  wrong() { tone(160, 0.18, 'sawtooth', 0.16); },
  cable() { tone(300 + rng() * 60, 0.04, 'triangle', 0.1); },
  crimp() { tone(240, 0.06, 'square', 0.18); },
  lock() { tone(740, 0.08, 'triangle', 0.2); },
  ding() { [660, 880, 1100].forEach((f, i) => tone(f, 0.18, 'triangle', 0.18, i * 0.08)); },
  level() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.2, i * 0.1)); },
  coin() { tone(1320, 0.06, 'triangle', 0.06); tone(1760, 0.07, 'triangle', 0.05, 0.04); },
  click() { tone(420, 0.04, 'triangle', 0.12); },
};

// ---- Data -------------------------------------------------------------------------------
const ORDER = ['T', 'L', 'F', 'D', 'X'];
const MACH = {
  T: { name: 'Troncatrice CNC', short: 'Tronc.', color: '#e8b52a', desc: 'Taglia le barre a misura' },
  L: { name: 'Tornio CNC', short: 'Tornio', color: '#3d8fd6', desc: 'Tornisce pezzi cilindrici' },
  F: { name: 'Fresa CNC', short: 'Fresa', color: '#4caf6a', desc: 'Fresa piani e scanalature' },
  D: { name: 'Foratrice CNC', short: 'Forat.', color: '#e07a2e', desc: 'Fora e filetta' },
  X: { name: 'Centro di lavoro 5 assi', short: '5 assi', color: '#8a5cd0', desc: 'Forme complesse su 5 assi' },
};

  { seq: 'T', name: 'Barra tagliata' }, { seq: 'TD', name: 'Distanziale forato' },
  { seq: 'TL', name: 'Perno tornito' }, { seq: 'TF', name: 'Piastra fresata' },
  { seq: 'TFL', name: 'Mozzo' }, { seq: 'TLF', name: 'Albero scanalato' },
  { seq: 'TLD', name: 'Boccola' }, { seq: 'TFD', name: 'Flangia forata' },
  { seq: 'TFLD', name: 'Ingranaggio' }, { seq: 'TLFD', name: 'Albero motore' },
  { seq: 'TX', name: 'Staffa complessa' }, { seq: 'TFX', name: 'Supporto lavorato' },
  { seq: 'TLX', name: 'Girante turbina' }, { seq: 'TFDX', name: 'Blocco motore' },
  { seq: 'TLFDX', name: 'Pala aeronautica' },
];
const recipeOf = seq => RECIPES.find(r => r.seq === seq);
const recipeVal = seq => recipeOf(seq) ? tune['val_' + seq] : tune.val_scrap;
const PHASES = ['Montaggio', 'Rete', 'Configurazione'];
const TOOLS = [
  { key: 'W', name: 'Chiave dinamometrica', phase: 0, req: 'toolReqW', eff: l => `${boltTurnsAt(l)} giri per bullone` },
  { key: 'C', name: 'Crimpatrice', phase: 1, req: 'toolReqC', eff: l => `${crimpTapsAt(l)} tocchi, rete +${Math.round(netMax(l) * 100)}%` },
  { key: 'Te', name: 'Tester digitale', phase: 2, req: 'toolReqT', eff: l => `zona verde ${Math.round(zoneAt(l) * 100)}%${l > 1 ? ', ago più lento' : ''}` },
];
const boltTurnsAt = l => Math.max(1, tune.boltTurns - (l - 1));
const crimpTapsAt = l => Math.max(1, tune.crimpTaps - (l - 1));
const zoneAt = l => tune.zoneBase + tune.zonePerLvl * (l - 1);
const needleAt = l => tune.needleSpeed * Math.max(0.2, 1 - tune.needleSlowPerLvl * (l - 1));
const toolCost = l => tune['toolCost' + (l + 1)]; // cost to go from l to l+1
const toolReq = (t, l) => tune[t.req] + (l - 1) * tune.toolReqStep;
// Two places: outside, a meadow where walls enclose land and factory buildings stand; inside each
// building, a grid shed (F) where machines, belts, stores, crates and the rack are placed.
const LOT = { c: 14, r: 10 };
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // output directions: +c, +r, -c, -r
const K = (c, r) => c + ',' + r;

const inShed = (c, r) => F.cells.has(K(c, r));

const rectCells = (bc, br, w, h) => { const s = new Set(); for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) s.add(K(bc + i, br + j)); return s; };
const cellAt = (c, r) => F.grid[K(c, r)];
const LOGI = {
  rack: { name: 'Rack di rete', desc: 'Il cuore della rete: senza rack le macchine non si collegano', base: () => tune.rackCost },
  src: { name: 'Magazzino barre', desc: 'Sforna una barra grezza dal lato della freccia', base: () => tune.sourceCost },
  crate: { name: 'Cassa vendita', desc: 'Vende ogni pezzo che ci entra, da qualsiasi lato', base: () => tune.crateCost },
};
const WORLD = () => ({ c: tune.worldCols, r: tune.worldRows });
const buildingCost = n => n === 0 ? 0 : tune['building' + (n + 1) + 'Cost'];
const buildingLvl = n => n === 0 ? 1 : tune['building' + (n + 1) + 'Lvl'];
const anyB = f => state.buildings.some(f);
const hasKind = (b, k) => Object.values(b.grid).some(o => o.kind === k);

const GOALS = [
  { text: 'Disegna il tuo capannone: trascina un rettangolo sul prato', done: () => state.buildings.length >= 1 },
  { text: 'Tocca il capannone per entrarci', done: () => state.entered },
  { text: 'Piazza un Magazzino barre e una Cassa (Negozio > Logistica)', done: () => anyB(b => hasKind(b, 'src') && hasKind(b, 'crate')) },
  { text: 'Compra la Troncatrice e piazzala nel capannone', done: () => allMachines().length >= 1 },
  { text: 'Costruiscila: montaggio e configurazione', done: () => built('T') },
  { text: 'Nastri: collega Magazzino > Troncatrice > Cassa', done: () => state.found.includes('T') },
  { text: 'Vendi i tuoi primi 5 pezzi', done: () => state.sold >= 5, prog: () => [state.sold, 5] },
  { text: 'Metti un Tornio DOPO la Troncatrice', done: () => state.found.includes('TL') },
  { text: `Livello ${CONFIG.rackLvl.value}: piazza il Rack di rete (Negozio > Logistica)`, done: () => anyB(b => hasKind(b, 'rack')) },
  { text: 'Collega una macchina in rete: toccala > Collega in rete', done: () => allMachines().some(m => m.netPct != null) },
  { text: 'Costruisci la Fresa CNC', done: () => built('F') },
  { text: 'Scopri una ricetta con 3 macchine', done: () => state.found.some(s => s.length >= 3) },
  { text: 'Allarga un capannone: disegna un rettangolo attaccato a lui', done: () => anyB(b => b.grown) },
  { text: 'Potenzia un attrezzo', done: () => state.tools.W + state.tools.C + state.tools.Te > 3 },
  { text: 'Scopri 6 ricette', done: () => state.found.length >= 6, prog: () => [state.found.length, 6] },
  { text: 'Fai un capannone a forma di U', done: () => anyB(b => isU(b)) },
  { text: 'Costruisci la Foratrice CNC', done: () => built('D') },
  { text: 'Produci l\'Albero motore (4 macchine)', done: () => state.found.includes('TLFD') },
  { text: 'Disegna un secondo capannone separato', done: () => state.buildings.length >= 2 },
  { text: 'Costruisci il Centro di lavoro 5 assi', done: () => built('X') },
  { text: 'Produci la Pala aeronautica (5 macchine)', done: () => state.found.includes('TLFDX') },
  { text: 'Raggiungi il livello massimo', done: () => state.level >= tune.maxLevel, prog: () => [state.level, tune.maxLevel] },

function isU(b) { // a notch: some column or row of the bounding box has an outside gap with building on both ends

// ---- State ------------------------------------------------------------------------------
let scene, state;

    t: 0, score: 0, gained: '',
    coins: tune.startCoins, xp: 0, level: 1, sold: 0, earned: 0,

}
function newBuilding(cells) {

  state.buildings.push(b);
  const keep = F; F = b; staffUp(true); F = keep;

}
function setCell(c, r, o) { o.c = c; o.r = r; F.grid[K(c, r)] = o; return o; }

function staffUp(first) { while (F.workers.length < Math.max(tune.workers, Math.floor(F.cells.size / tune.cellsPerWorker))) addWorker(first && F.workers.length === 0); }
function addWorker(first) {
  const cells = walkCells(), pick = cells[Math.floor((first ? 0.5 : rng()) * cells.length)] || [0, 0];
  F.workers.push({ c: pick[0] + 0.5, r: pick[1] + 0.5, path: [], dir: 1, walkT: 0, idleT: 1 + rng() * 2, task: null, wave: first ? 4.5 : 0 });
}
function allMachines() { return state.buildings.flatMap(b => b.machines); }
function built(t) { return allMachines().some(m => m.type === t && m.phase >= 2); }

function costOf(t) { return Math.round(mcfg('cost', t) * (1 + tune.copyMult * owned(t))); }
// the first rack, store and crate of each building are free
function logiCost(k) { const n = countKind(k); return n === 0 ? 0 : Math.round(LOGI[k].base() * (1 + tune.logisticsCopyMult * (n - 1))); }

function serialize() {
  return JSON.stringify({
    v: 5, coins: state.coins, xp: state.xp, level: state.level, sold: state.sold, earned: state.earned,
    tools: state.tools, beltsLaid: state.beltsLaid, found: state.found, goal: state.goal, nextId: state.nextId,
    entered: state.entered,
    buildings: state.buildings.map(b => ({
      id: b.id, name: b.name, tiles: [...b.cells], grown: b.grown, workers: b.workers.length,

// Each phase: an intro card, the minigame, a result card. The percentage comes from the time

const MG = { x: 190, y: 92, w: 900, h: 560 };

function placeRackFromMg() {

}
function mgPct(mg) {

function beginPhase() {

      sr = Math.floor(rng() * gr); er = Math.floor(rng() * gr);

      for (let k = 0; k < nObs; k++) { const c = 1 + Math.floor(rng() * (gc - 2)), r = Math.floor(rng() * gr); grid[r][c] = 1 + Math.floor(rng() * 3); }

function inWorld(c, r) { const D = WORLD(); return c >= 0 && r >= 0 && c < D.c && r < D.r; }

  if (P.target && P.fresh.length && (P.join.w < tune.joinWidth || P.join.d < tune.joinDepth)) return `Collegamento troppo stretto: serve un passaggio di almeno ${tune.joinWidth}×${tune.joinDepth} per i nastri`;

  else if (state.tool === 'rotate') hint('Ruota: tocca una macchina, un nastro o un magazzino per girare la sua uscita');
  else if (state.tool === 'demo') hint('Demolisci: tocca un nastro per toglierlo, il resto due volte per venderlo');
  else if (!F && state.wtool === 'draw') hint(`Capannone: trascina un rettangolo sul prato per disegnarne le pareti (${tune.cellCost} monete a cella)`);
  if (!F && state.wplacing) {
    hint('Capannone: tocca dentro le mura, su terreno libero (verde = va bene)');
    button('Annulla', W / 2 - 80, 168, 160, 46, () => { state.wplacing = null; }, { color: '#9aa4ad', size: 18, name: 'cancelB' });
  }
}

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#2b3a48');
      ORDER.forEach((tp, i) => {
        const x = 150 + i * 245, y = 330;
        ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x - 110, 90, 220, 300);
        machineIcon(tp, x, y, 2.6, { t: 1.3, busy: true, status: 'work' });
        text(MACH[tp].name, x, 420, 17, '#fff');
      });
      const at = (x, y, s, c, r, f) => { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const p = iso(c, r); ctx.translate(-p[0], -p[1]); f(); ctx.restore(); };
      const items = [
        ['Operaio', (x, y) => sprite('walk0', x, y, 5, false)],
        ['Operaio che saluta', (x, y) => sprite('wave', x, y, 5, false)],
        ['Operaio al lavoro', (x, y) => sprite('work', x, y, 5, false)],
        ['Rack di rete', (x, y) => at(x, y + 30, 1.5, 0.5, 0.5, () => drawRack(0, 0, 1))],
        ['Magazzino barre', (x, y) => at(x, y + 10, 1.8, 0.5, 0.5, () => drawSource(0, 0))],
        ['Cassa vendita', (x, y) => at(x, y + 10, 1.8, 0.5, 0.5, () => drawCrateAt(0, 0, 0))],
        ['Nastro e pezzi', (x, y) => at(x, y, 1.6, 1.5, 0.5, () => { [0, 1, 2].forEach(c => drawBelt({ c, r: 0, dir: 0 }, 0)); ['', 'T', 'TL', 'TF', 'TFD', 'TX'].forEach((o, k) => drawPiece(o, 0.35 + k * 0.48, 0.5)); })],
      ];
      items.push(['Capannone', (x, y) => at(x, y + 10, 0.55, 1.5, 1.5, () => drawBuildingOut({ machines: [] }, 0, rectCells(0, 0, 3, 3)))]);
      items.forEach(([name, f], i) => { const x = 70 + i * 142, y = 600; f(x, y); text(name, x, 660, 14, '#fff'); });
    },
  },
  title: {
    update() {
      const tp = taps.splice(0);
      for (const p of tp) hitButtons(p.x, p.y);
      if (pressed('Enter') || pressed('Space')) startGame(true);
      if (pressed('KeyN')) startGame(false);
    },
    draw() {
      ui = { buttons: [], named: {} };
      drawOutside(clock.now());
      ctx.fillStyle = 'rgba(14,20,28,0.62)'; ctx.fillRect(0, 0, W, H);
      rrect(W / 2 - 360, 70, 720, 130, 22, 'rgba(28,36,44,0.92)', '#f2c230', 4);
      for (let i = 0; i < 680; i += 34) { ctx.fillStyle = (i / 34) % 2 ? '#2b2b2b' : '#f2c230'; ctx.fillRect(W / 2 - 340 + i, 178, 34, 8); }
      textO(TITLE, W / 2, 124, 72, '#f2c230', 'center', '#2b2b2b');
      text('Compra, monta, cabla e configura le tue macchine CNC', W / 2, 232, 22, '#e6e1d3');
      rrect(W / 2 - 440, 266, 880, 148, 14, 'rgba(20,26,34,0.9)', '#3a4552', 2);
      CONTROLS.forEach((c, i) => text(c, W / 2, 290 + i * 34, 18, '#cfd6dd'));
      ORDER.forEach((tp, i) => machineIcon(tp, W / 2 - 400 + i * 200, 520, 1.3, { t: clock.now(), busy: true, status: 'work' }));
      const sv = hasSave();
      button(sv ? 'Continua' : 'Gioca', W / 2 - 150, 560, 300, 70, () => startGame(true), { size: 28, name: 'play' });
      if (sv) button(confirmNew ? 'Sicuro? Tocca ancora' : 'Nuova partita (N)', W / 2 - 150, 642, 300, 50, () => startGame(false), { size: 18, color: '#9aa4ad', name: 'new' });
      text(sv ? 'Invio: continua' : 'Invio o tocca per iniziare', W / 2, 708, 15, '#9aa4ad');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.panel && !state.mg && !state.placing && !state.tool && !state.wtool && !state.wplacing)) { scene = 'pause'; confirmNew = 0; return; }
      if (pressed('Escape')) { if (state.mg && state.mg.step === 'intro') state.mg = null; state.panel = null; state.placing = null; state.tool = null; state.demo = null; state.wtool = null; state.wplacing = null; }
      if (pressed('KeyX') && F && !state.mg) exitBuilding();
      if (!state.mg) {
        if (pressed('KeyB')) { openPanel(F ? 'shop' : 'wshop'); state.shopTab = 0; }
        if (pressed('KeyR')) openPanel('recipes');
        if (pressed('KeyT')) openPanel('tools');
        if (!state.panel) {
          if (F) {
            if (pressed('Digit1')) setTool(state.tool === 'belt' ? null : 'belt');
            if (pressed('Digit2')) setTool(state.tool === 'rotate' ? null : 'rotate');
            if (pressed('Digit3')) setTool(state.tool === 'demo' ? null : 'demo');
          } else if (pressed('Digit1')) { if (state.wtool === 'draw') state.wtool = null; else setWTool('draw'); }
          if (pressed('KeyE')) rotatePlacing();
          const sp = tune.panSpeed * dt / cam.zoom;
          if (down.has('ArrowLeft')) cam.x -= sp; if (down.has('ArrowRight')) cam.x += sp;
          if (down.has('ArrowUp')) cam.y -= sp; if (down.has('ArrowDown')) cam.y += sp;
          if (pressed('Equal') || pressed('NumpadAdd')) setZoom(cam.zoom * 1.2);
          if (pressed('Minus') || pressed('NumpadSubtract')) setZoom(cam.zoom / 1.2);
          clampCam();
        }
      } else updateMinigame(dt);
      if (state.wallDrag) {
        if (!F && !state.panel && state.wtool === 'draw') { if (ptr.down) wallDragStep(); }
        if (!ptr.down) { const d = state.wallDrag; state.wallDrag = null; if (d.a && d.b && (d.a[0] !== d.b[0] || d.a[1] !== d.b[1])) commitDraw(rectOf(d.a, d.b)); }
      }
      if (state.beltDrag) {
        if (!state.mg && !state.panel && state.tool === 'belt') beltDragStep();
        if (!ptr.down) state.beltDrag = null;
      }
      const tp = taps.splice(0);
      for (const p of tp) { if (!hitButtons(p.x, p.y) && !state.mg && !state.panel) { if (F) worldTap(p.x, p.y); else outsideTap(p.x, p.y); } }
      updateWorld(dt);
    },
    draw() {
      const t = state.t;
      ui = { buttons: [], named: {} };
      if (F) { drawWorld(t); drawOverlaysWorld(t); } else { drawOutside(t); drawOverlaysOut(t); }
      drawHUD(t);
      drawTopLayer(t);
      if (state.panel === 'shop') drawShop(t);
      else if (state.panel === 'recipes') drawRecipes(t);
      else if (state.panel === 'tools') drawTools(t);
      else if (state.panel === 'machine') drawMachinePanel(t);
      else if (state.panel === 'wshop') drawWorldShop(t);
      if (state.mg) drawMinigame(t);
      drawTutorial(t);
    },
  },
  pause: {
    update() {
      const tp = taps.splice(0); for (const p of tp) hitButtons(p.x, p.y);
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyN')) newGameFromPause();
    },
    draw() {
      scenes.play.draw(); ui = { buttons: [], named: {} };
      ctx.fillStyle = 'rgba(10,14,20,0.7)'; ctx.fillRect(0, 0, W, H);
      textO('Pausa', W / 2, 220, 64, '#f2c230');
      text('La fabbrica è salvata automaticamente.', W / 2, 290, 20, '#e6e1d3');
      button('Riprendi (P)', W / 2 - 150, 340, 300, 66, () => { scene = 'play'; }, { size: 24, name: 'resume' });
      button(confirmNew ? 'Sicuro? Tocca ancora' : 'Ricomincia da zero (N)', W / 2 - 150, 430, 300, 54, newGameFromPause, { size: 18, color: '#ff8a7a', name: 'restart' });
      text(muted ? 'Audio: spento (M)' : 'Audio: acceso (M)', W / 2, 520, 18, '#cfd6dd');
    },
  },
};
function newGameFromPause() {
  if (!confirmNew) { confirmNew = 1; return; }
  confirmNew = 0; wipeSave(); reset(); scene = 'play'; toast('Nuova fabbrica!', '#7ef0a0');
}
function startGame(cont) {
  if (cont && hasSave()) { if (!load()) reset(); }
  else if (!cont && hasSave()) { if (!confirmNew) { confirmNew = 1; return; } confirmNew = 0; wipeSave(); reset(); }
  else reset();
  scene = 'play'; startAudio();
}
function hitButtons(x, y) {
  for (let i = ui.buttons.length - 1; i >= 0; i--) {
    const b = ui.buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; }
  }
  return false;
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  if (taps.length) drawFrame(); // buttons are laid out by drawing: make sure they match this state
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx.setTransform(VIEW_R, 0, 0, VIEW_R, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  tap(x, y) { taps.push({ x, y }); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
